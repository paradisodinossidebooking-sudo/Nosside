name: Deploy Cloudflare Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Deploy staging Preview
        shell: bash
        run: |
          npx --yes wrangler@latest preview --name staging --worker-name nosside
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set GOOGLE_PRIVATE_KEY
        shell: bash
        run: |
          printf '%s' "$GOOGLE_PRIVATE_KEY" | npx --yes wrangler@latest preview secret put GOOGLE_PRIVATE_KEY --name staging --worker-name nosside
        env:
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set RESEND_API_KEY
        shell: bash
        run: |
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@latest preview secret put RESEND_API_KEY --name staging --worker-name nosside
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify GOOGLE_PRIVATE_KEY
        shell: bash
        run: |
          npx --yes wrangler@latest preview secret list --name staging --worker-name nosside
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
