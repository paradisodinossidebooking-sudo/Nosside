name: Set Cloudflare Staging Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GOOGLE_PRIVATE_KEY on staging Preview
        shell: bash
        run: |
          printf '%s' "$GOOGLE_PRIVATE_KEY" | npx --yes wrangler@latest preview secret put GOOGLE_PRIVATE_KEY --name staging --worker-name nosside
        env:
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
